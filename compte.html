<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforme - Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        }
        
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .platform-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        span{
           color: #FFD700;
        }
        
        .platform-subtitle {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #666;
            font-size: 16px;
            transition: all 0.3s ease;
            border: solid 1px;
        }
        
        .input-field::placeholder {
            color:#666;
        }
        
        .input-field:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .login-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            background-color: #FFD700;
            color: #333;
            font-weight: 600;
            width: 340px;
            
        }
        
        .login-btn:hover {
            background-color: #FFC700;
        }
        
        
       
        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
            }
            
            .social-buttons, .social-row {
                flex-direction: column;
            }
            
            .social-btn {
                margin: 5px 0;
            }
            
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="platform-name">Vision<span>Flow</span></div>
            <div class="platform-subtitle">Organisez vos événements avec facilité et clarté</div>
        </div>
        
        <div class="login-box">
            <h2 class="login-title">Création de compte</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" class="input-field" placeholder="Email" required>
                </div>
                
                <div class="form-group">
                    <input type="password" class="input-field" id="password" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="login-btn">Créer</button>
            </form>
            
        </div>
    </div>
    
    
</body>
</html>
